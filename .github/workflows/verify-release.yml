name: Verify Keycloak Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v26.8.1
permissions:
  contents: read
concurrency:
  group: keycloak-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.keycloak-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.keycloak', info['package']
              assert info['name'] == 'Keycloak', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'Apache-2.0', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              raw = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(raw)
              app = m['application']
              assert app['subdomain'] == 'keycloak', app['subdomain']
              ups = app['upstreams']
              assert any(u['location'] == '/' and 'keycloak:8080' in (u.get('backend') or '')
                         for u in ups), ups
              # the database must never be reachable through the ingress
              for u in ups:
                  b = u.get('backend') or ''
                  assert 'db:' not in b, b

              svcs = m['services']
              assert set(svcs) == {'keycloak', 'db'}, set(svcs)

              kc = svcs['keycloak']
              assert 'keycloak/keycloak' in kc['image'], kc['image']
              assert kc['image'].endswith(':' + tag.lstrip('v')), kc['image']

              # production profile, not the dev one
              assert kc['command'] == ['start'], kc['command']

              env = ' '.join(str(x) for x in kc['environment'])
              # dev-file is not usable with the production profile
              assert 'KC_DB=postgres' in env, env
              assert 'dev-file' not in env, 'dev-file store is not for production'
              assert 'KC_DB_URL=jdbc:postgres://db:5432/keycloak' in env, env
              assert 'KC_DB_USERNAME=' in env, env
              # 26.x renamed the bootstrap admin variables
              assert 'KC_BOOTSTRAP_ADMIN_USERNAME=' in env and '.U.admin_username' in env, env
              assert 'KC_BOOTSTRAP_ADMIN_PASSWORD=' in env and '.U.admin_password' in env, env
              assert 'KEYCLOAK_ADMIN' not in env, 'deprecated admin variable in use'
              # reverse proxy: without these the generated URLs point inward
              assert 'KC_HOSTNAME=https://' in env, env
              assert 'KC_PROXY_HEADERS=xforwarded' in env, env
              assert 'KC_HTTP_ENABLED=true' in env, env

              assert any(b.endswith(':/opt/keycloak/data') for b in kc['binds']), kc['binds']

              db = svcs['db']
              assert 'postgres:16' in db['image'], db['image']
              assert 'healthcheck' in db
              assert any(b.endswith(':/var/lib/postgresql/data') for b in db['binds']), db['binds']

              params = yaml.safe_load(package.extractfile('deploy_params.yml').read())
              by_id = {q['id']: q for q in params['params']}
              assert set(by_id) == {'admin_username', 'admin_password'}, set(by_id)
              assert by_id['admin_password']['type'] == 'secret'
              assert 'random' in str(by_id['admin_password'].get('default_value', ''))
              refs = set(re.findall(r'\.U\.([A-Za-z0-9_]+)', raw))
              assert refs <= set(by_id), (refs, set(by_id))

              assert 'healthcheck' not in kc, kc
              assert 'lzc-file-chooser' not in raw
              assert 'usage' in m and str(m['usage']).strip(), 'usage section missing'
              usage_text = str(m['usage'])
              assert ('真机验证' in usage_text or '实机验证' in usage_text), 'usage must state no device test'

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  main_lic = [n for n in lic if n.endswith('/LICENSE')]
                  target = main_lic[0] if main_lic else lic[0]
                  license_text = content.extractfile(target).read().decode()
                  flat = ' '.join(license_text.split())
                  assert 'Apache License' in flat and 'Version 2.0' in flat, flat[:150]

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
              'note': 'production profile with PostgreSQL; bootstrap admin from deploy params',
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
